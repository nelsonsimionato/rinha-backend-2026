# v0.21: v0.18 FD-passing topology + startup warmup + EPOLL_TIMEOUT_MS=1.
# NO cpuset (v0.20 cpuset regressed p99 on the test box — see issue #1).
# API image v0.20-fd-warm adds two env-gated knobs over v0.18-fd:
#   - WARMUP_QUERIES=5000 : run 5000 searches over sample index vectors at boot
#                           to warm the search path (branch predictors, I-cache).
#   - EPOLL_TIMEOUT_MS=1  : epoll_wait polls every 1ms instead of blocking, to
#                           keep the API runnable and cut wakeup latency.
# LB image unchanged (v0.18-lbfd). Budget: 0.10 + 2×0.45 = 1.0 CPU, 350 MB.
networks:
  rinha_net:
    driver: bridge
volumes:
  sock: {}

services:
  lb:
    image: docker.io/nelsonsimionato/rinha-backend-2026:v0.18-lbfd
    command: ["--port", "9999", "/sock/api1.sock", "/sock/api2.sock"]
    ports:
      - "9999:9999"
    volumes:
      - sock:/sock
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 30M
    networks:
      - rinha_net
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy

  api1: &api
    image: docker.io/nelsonsimionato/rinha-backend-2026:v0.20-fd-warm
    environment:
      - FDSOCK=/sock/api1.sock
      - EPOLL_TIMEOUT_MS=1
      - WARMUP_QUERIES=5000
    volumes:
      - sock:/sock
    deploy:
      resources:
        limits:
          cpus: '0.45'
          memory: 160M
    networks:
      - rinha_net
    healthcheck:
      test: ["CMD", "/api", "--healthcheck"]
      start_period: 12s
      interval: 5s
      timeout: 3s
      retries: 20

  api2:
    <<: *api
    environment:
      - FDSOCK=/sock/api2.sock
      - EPOLL_TIMEOUT_MS=1
      - WARMUP_QUERIES=5000
