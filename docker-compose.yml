# v0.22: v0.21 (warmup + EPOLL_TIMEOUT_MS=1, no cpuset) + SPIN_US=50.
# Spin-before-block on the epoll loop: busy-poll up to 50µs to catch imminent
# requests with no scheduler-wakeup latency (the lever dalvorsn/fksegundo use
# to hit 0.37ms). Bounded spin (~6% idle CPU at 50µs) — safe under 0.45 quota.
# Goal: shave ~0.11ms off v0.21's 1.111ms p99 to cross the 1.0ms / 6000 cap.
# Image v0.22-fd-spin; LB unchanged. cpus 0.45/0.45/0.10 = 1.0, mem 350MB.
networks:
  rinha_net:
    driver: bridge
volumes:
  sock: {}

services:
  lb:
    image: docker.io/nelsonsimionato/rinha-backend-2026:v0.18-lbfd
    command: ["--port", "9999", "/sock/api1.sock", "/sock/api2.sock"]
    ports:
      - "9999:9999"
    volumes:
      - sock:/sock
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 30M
    networks:
      - rinha_net
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy

  api1: &api
    image: docker.io/nelsonsimionato/rinha-backend-2026:v0.22-fd-spin
    environment:
      - FDSOCK=/sock/api1.sock
      - EPOLL_TIMEOUT_MS=1
      - WARMUP_QUERIES=5000
      - SPIN_US=50
    volumes:
      - sock:/sock
    deploy:
      resources:
        limits:
          cpus: '0.45'
          memory: 160M
    networks:
      - rinha_net
    healthcheck:
      test: ["CMD", "/api", "--healthcheck"]
      start_period: 12s
      interval: 5s
      timeout: 3s
      retries: 20

  api2:
    <<: *api
    environment:
      - FDSOCK=/sock/api2.sock
      - EPOLL_TIMEOUT_MS=1
      - WARMUP_QUERIES=5000
      - SPIN_US=50
