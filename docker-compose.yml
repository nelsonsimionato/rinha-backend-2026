networks:
  rinha_net:
    driver: bridge

# v0.20: v0.18 FD-passing topology + cpuset CPU-core pinning (chase sub-1ms p99).
# Single-hop FD-passing: the LB (lbfd) accepts client connections and hands the
# socket FD to an API via SCM_RIGHTS over a shared-volume unix socket; the API
# serves the client DIRECTLY (LB leaves the data path). All on the bridge network.
#
# NEW in v0.20: pin each container to dedicated cores via `cpuset` (api1->0,
# api2->1, lb->2,3). On the 4-vCPU GHA runner, unpinned API processes get
# migrated across cores on each wakeup (cold cache + run-queue contention +
# inescapable vCPU steal) — the ~0.8ms tail behind our 1.2ms p99. Pinning gives
# each API a warm, uncontended core. Evidence: every sub-0.4ms / 6000 entry on
# the preview leaderboard pins with cpuset; every ~1.2ms entry (incl. us) did
# not. `cpuset` is placement, NOT quota — it does not count against the 1-CPU
# limit (cpus quotas below still sum to 1.0).
# Budget: 0.10 (lb) + 2×0.45 (api) = 1.0 CPU, 30 + 2×160 = 350 MB.
volumes:
  sock: {}

services:
  lb:
    image: docker.io/nelsonsimionato/rinha-backend-2026:v0.18-lbfd
    command: ["--port", "9999", "/sock/api1.sock", "/sock/api2.sock"]
    ports:
      - "9999:9999"
    volumes:
      - sock:/sock
    cpuset: "2,3"
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 30M
    networks:
      - rinha_net
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy

  api1: &api
    image: docker.io/nelsonsimionato/rinha-backend-2026:v0.18-fd
    environment:
      - FDSOCK=/sock/api1.sock
    volumes:
      - sock:/sock
    cpuset: "0"
    deploy:
      resources:
        limits:
          cpus: '0.45'
          memory: 160M
    networks:
      - rinha_net
    healthcheck:
      test: ["CMD", "/api", "--healthcheck"]
      start_period: 12s
      interval: 5s
      timeout: 3s
      retries: 20

  api2:
    <<: *api
    cpuset: "1"
    environment:
      - FDSOCK=/sock/api2.sock
