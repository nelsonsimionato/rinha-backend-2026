networks:
  rinha_net:
    driver: bridge

services:
  haproxy:
    image: haproxy:2.8-alpine
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "9999:9999"
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 30M
    networks:
      - rinha_net
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy

  # Phase 2: i16 index (~118 MB) no longer fits 4×80 MB → 2 fat instances.
  # Budget: 2×0.45 + 0.10 = 1.0 CPU, 2×160 + 30 = 350 MB. Each API holds the
  # full index (no sharding); haproxy round-robins.
  api1: &api
    image: docker.io/nelsonsimionato/rinha-backend-2026:v0.15-i16
    deploy:
      resources:
        limits:
          cpus: '0.45'
          memory: 160M
    networks:
      - rinha_net
    healthcheck:
      test: ["CMD", "/api", "--healthcheck"]
      start_period: 12s
      interval: 5s
      timeout: 3s
      retries: 20

  api2:
    <<: *api
