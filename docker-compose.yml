# FINAL: espelho da configuração travada na branch `submission` (commit dbebe2b,
# v0.25) — a que o avaliador executou. Resultado oficial: 6000/6000, p99
# 0.4581ms, 4º lugar geral. Imagens: v0.25-lean (APIs) + v0.24-lbfd (LB).
# Receita: keep-warm epoll_pwait2(EPOLL_IDLE_US=60) re-block (core fica em C1,
# clock alto, custo ~2-3% CPU independente de carga), SPIN_US=0 (spin só após
# eventos processados), BUSY_POLL_US=5 (NAPI busy-poll, best-effort),
# LB DEFER_ACCEPT=1 (accept acorda só com bytes prontos). Layout: APIs nos
# cpus 0/1 (0.49 cada, um por core físico), LB em "2,3" (HT siblings, 0.02).
# cpuset é posicionamento, não quota — não conta contra o limite de 1 CPU.
networks:
  rinha_net:
    driver: bridge
volumes:
  sock: {}

services:
  lb:
    image: docker.io/nelsonsimionato/rinha-backend-2026:v0.24-lbfd
    command: ["--port", "9999", "/sock/api1.sock", "/sock/api2.sock"]
    environment:
      - DEFER_ACCEPT=1
    ports:
      - "9999:9999"
    volumes:
      - sock:/sock
    cpuset: "2,3"
    deploy:
      resources:
        limits:
          cpus: '0.02'
          memory: 30M
    networks:
      - rinha_net
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy

  api1: &api
    image: docker.io/nelsonsimionato/rinha-backend-2026:v0.25-lean
    environment:
      - FDSOCK=/sock/api1.sock
      - EPOLL_TIMEOUT_MS=1
      - WARMUP_QUERIES=5000
      - SPIN_US=0
      - EPOLL_IDLE_US=60
      - BUSY_POLL_US=5
    volumes:
      - sock:/sock
    cpuset: "0"
    deploy:
      resources:
        limits:
          cpus: '0.49'
          memory: 160M
    networks:
      - rinha_net
    healthcheck:
      test: ["CMD", "/api", "--healthcheck"]
      start_period: 12s
      interval: 5s
      timeout: 3s
      retries: 20

  api2:
    <<: *api
    cpuset: "1"
    environment:
      - FDSOCK=/sock/api2.sock
      - EPOLL_TIMEOUT_MS=1
      - WARMUP_QUERIES=5000
      - SPIN_US=0
      - EPOLL_IDLE_US=60
      - BUSY_POLL_US=5
