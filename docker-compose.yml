networks:
  rinha_net:
    driver: bridge

# Phase 2 topology: 2 API instances (i16 index is ~118 MB, no longer fits the
# 4×80 MB layout). Budget: 2×0.45 + 0.10 = 1.0 CPU, 2×160 + 30 = 350 MB.
# Each API holds the full index (no sharding); the LB round-robins.
services:
  haproxy:
    image: haproxy:2.8-alpine
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "9999:9999"
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 30M
    networks:
      - rinha_net
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy

  api1: &api
    build:
      context: .
      dockerfile: c-impl/Dockerfile   # C impl; root Dockerfile is the legacy Go build
    deploy:
      resources:
        limits:
          cpus: '0.45'
          memory: 160M
    networks:
      - rinha_net
    healthcheck:
      # C image: self-probe via the built-in healthcheck mode.
      test: ["CMD", "/api", "--healthcheck"]
      # Cold start spans the 118 MB i16 index mmap + pre-warm loop (one byte / 4KB page).
      start_period: 12s
      interval: 5s
      timeout: 3s
      retries: 20

  api2:
    <<: *api
