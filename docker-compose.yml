# v0.24: v0.23 (warmup + EPOLL_TIMEOUT_MS=1 + SPIN_US=50 + cpuset 1/2/3) +
# KEEP-WARM serving loop + LB DEFER_ACCEPT. Copied from the #1 preview entry's
# annotated recipe (chrisamora-c, 0.301ms): EPOLL_IDLE_US=60 blocks in
# epoll_pwait2 with a 60µs timeout and re-blocks on timeout, so the pinned core
# never predicts >60µs idle -> cpuidle stays in shallow C1 (no C3/C6 exit,
# ~30-100µs on Haswell) and intel_pstate keeps the clock up. Cost ~2-3% CPU,
# load-INVARIANT (cannot trip the CFS quota on the heavier final script —
# validated locally at 2500 req/s: 0 throttles, E=0). SPIN_US now spins only
# right after processed events (idle ticks sleep), so v0.24 uses LESS CPU than
# v0.23 overall. LB DEFER_ACCEPT=1: accept wakes only when the first request
# bytes arrived -> handed-off fd is instantly readable (kills the new-conn
# double-wakeup ~14ms tail). Fallbacks: pwait2 ENOSYS -> EPOLL_TIMEOUT_MS=1.
# cpuset 1/2/3 unchanged (proven 0.422ms): APIs on cpu1/cpu2, LB on cpu3,
# cpu0 free for OS/IRQs/k6. cpus 0.45/0.45/0.10 = 1.0, mem 350MB.
# Revert to v0.23 (956a0a3) if the preview regresses.
networks:
  rinha_net:
    driver: bridge
volumes:
  sock: {}

services:
  lb:
    image: docker.io/nelsonsimionato/rinha-backend-2026:v0.24-lbfd
    command: ["--port", "9999", "/sock/api1.sock", "/sock/api2.sock"]
    environment:
      - DEFER_ACCEPT=1
    ports:
      - "9999:9999"
    volumes:
      - sock:/sock
    cpuset: "3"
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 30M
    networks:
      - rinha_net
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy

  api1: &api
    image: docker.io/nelsonsimionato/rinha-backend-2026:v0.24-keepwarm
    environment:
      - FDSOCK=/sock/api1.sock
      - EPOLL_TIMEOUT_MS=1
      - WARMUP_QUERIES=5000
      - SPIN_US=50
      - EPOLL_IDLE_US=60
    volumes:
      - sock:/sock
    cpuset: "1"
    deploy:
      resources:
        limits:
          cpus: '0.45'
          memory: 160M
    networks:
      - rinha_net
    healthcheck:
      test: ["CMD", "/api", "--healthcheck"]
      start_period: 12s
      interval: 5s
      timeout: 3s
      retries: 20

  api2:
    <<: *api
    cpuset: "2"
    environment:
      - FDSOCK=/sock/api2.sock
      - EPOLL_TIMEOUT_MS=1
      - WARMUP_QUERIES=5000
      - SPIN_US=50
      - EPOLL_IDLE_US=60
