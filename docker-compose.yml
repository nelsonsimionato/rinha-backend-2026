networks:
  rinha_net:
    driver: bridge

services:
  haproxy:
    image: haproxy:2.8-alpine
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "9999:9999"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 30M
    networks:
      - rinha_net
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy

  # v0.16: CPU rebalanced to the LB. Diagnosis showed the p99 was HAProxy
  # throttling at 0.10 CPU while the APIs sat idle (~0.01 CPU used of 0.45).
  # Budget: 0.50 (haproxy) + 2×0.25 (api) = 1.0 CPU, 30 + 2×160 = 350 MB.
  # Each API holds the full i16 index (no sharding); haproxy round-robins.
  api1: &api
    image: docker.io/nelsonsimionato/rinha-backend-2026:v0.17-s10k
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 160M
    networks:
      - rinha_net
    healthcheck:
      test: ["CMD", "/api", "--healthcheck"]
      start_period: 12s
      interval: 5s
      timeout: 3s
      retries: 20

  api2:
    <<: *api
