networks:
  rinha_net:
    driver: bridge

# v0.18: single-hop FD-passing. The LB (lbfd) accepts client connections and
# hands the socket FD to an API via SCM_RIGHTS over a shared-volume unix socket;
# the API serves the client DIRECTLY (the LB leaves the data path). Eliminates
# the 2-hop proxy wakeups behind the p99. All on the bridge network (spec-clean);
# the shared `sock` volume only carries the unix-domain socket. CPU is flipped
# back to the APIs since the LB is now near-idle.
# Budget: 0.10 (lb) + 2×0.45 (api) = 1.0 CPU, 30 + 2×160 = 350 MB.
volumes:
  sock: {}

services:
  lb:
    image: docker.io/nelsonsimionato/rinha-backend-2026:v0.18-lbfd
    command: ["--port", "9999", "/sock/api1.sock", "/sock/api2.sock"]
    ports:
      - "9999:9999"
    volumes:
      - sock:/sock
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 30M
    networks:
      - rinha_net
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy

  api1: &api
    image: docker.io/nelsonsimionato/rinha-backend-2026:v0.19-fd
    environment:
      - FDSOCK=/sock/api1.sock
    volumes:
      - sock:/sock
    deploy:
      resources:
        limits:
          cpus: '0.45'
          memory: 160M
    networks:
      - rinha_net
    healthcheck:
      test: ["CMD", "/api", "--healthcheck"]
      start_period: 12s
      interval: 5s
      timeout: 3s
      retries: 20

  api2:
    <<: *api
    environment:
      - FDSOCK=/sock/api2.sock
